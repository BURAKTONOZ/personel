name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Kodu İndir
      uses: actions/checkout@v4

    - name: Python Kurulumu (Derleme Hatası İçin)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Gerekli Paketleri Yükle
      run: npm install

    - name: Exe Dosyasını Derle
      run: npm run build

    - name: Exe Dosyasını Çıktı Olarak Ver
      uses: actions/upload-artifact@v4
      with:
        name: Numarataj-Personel-Uygulamasi
        path: dist/*.exe
